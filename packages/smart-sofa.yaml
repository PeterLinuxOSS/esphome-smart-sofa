# =============================================================================
#  Smart Sofa — ESPHome package
#  ESP32-WROOM-32-N4 + INA226 (shunt) + 2x AQY212GH PhotoMOS + 2x PC817C
#
#  Position is estimated from travel time; the end stops are detected from
#  motor current, so no limit switches are needed. Include this package and
#  override the substitutions below in your device file.
#
#  NOTE: this package must not use !secret — ESPHome cannot resolve secrets
#  inside a remote package. Keep wifi/api/ota in the device config.
# =============================================================================

substitutions:
  device_name:   smart-sofa
  friendly_name: Smart Sofa

  # Inputs — original hand controller, opto-isolated through PC817C
  pin_btn_open:  "GPIO25"    # SIG1  <- U2 (PC817C), button IN1
  pin_btn_close: "GPIO26"    # SIG2  <- U4 (PC817C), button IN2

  # Outputs — PhotoMOS relays driving the actuator
  pin_out_open:  "GPIO17"    # SOUT1 -> R10 470R -> U5 -> OUT1
  pin_out_close: "GPIO16"    # SOUT2 -> R11 470R -> U6 -> OUT2

  # I2C — INA226 current sensor
  pin_scl:       "GPIO21"
  pin_sda:       "GPIO22"
  ina_address:   "0x40"
  shunt_ohm:     "0.02"
  max_current:   "4.0"

  # Full-travel times. Only seed values — calibration overwrites them and they
  # survive reboots (restore_value on the globals). Measure once, then forget.
  extend_time_ms:  "9000"    # full extend  (open, position 0 -> 1)
  retract_time_ms: "10000"   # full retract (close, position 1 -> 0)

  # Entity names. Overridable so the dashboard can be in any language without
  # forking — see docs/home-assistant.md before changing them on a live system.
  name_cover:          "Sofa"
  name_current:        "Actuator current"
  name_voltage:        "Supply voltage"
  name_power:          "Power"
  name_position:       "Position"
  name_extend_time:    "Measured extend time"
  name_retract_time:   "Measured retract time"
  name_wifi_signal:    "WiFi signal"
  name_uptime:         "Uptime"
  name_btn_up:         "Button up"
  name_btn_down:       "Button down"
  name_moving:         "Sofa moving"
  name_button_lock:    "Button lock"
  name_endstop_thr:    "Endstop threshold"
  name_startup_grace:  "Startup grace period"
  name_max_runtime:    "Max runtime"
  name_endstop_debounce: "Endstop confirmation time"
  name_calibrate:      "Calibrate (both ends)"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 600
    then:
      # Never resume a movement across a reboot; the position is restored
      # instead. Calibration is manual only — see docs/calibration.md.
      - switch.turn_off: sw_open
      - switch.turn_off: sw_close

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
  level: INFO

# =============================================================================
#  Current measurement — INA226
# =============================================================================
i2c:
  sda: ${pin_sda}
  scl: ${pin_scl}
  scan: true
  frequency: 400kHz

sensor:
  - platform: ina226
    address: ${ina_address}
    shunt_resistance: ${shunt_ohm} ohm
    max_current: ${max_current}A
    adc_averaging: 16
    update_interval: 100ms      # fast, but internal — needed for endstop detection
    current:
      id: current_a
      internal: true            # scripts only, keeps HA and the log quiet
      filters:
        - median:
            window_size: 5
            send_every: 1
    bus_voltage:
      id: voltage_v
      internal: true
    power:
      id: power_raw
      internal: true

  # Public sensors — throttled to 1 s and gated by a delta, so small ripple
  # never reaches HA or the recorder.
  - platform: template
    name: "${name_current}"
    unit_of_measurement: "A"
    accuracy_decimals: 3
    lambda: "return id(current_a).state;"
    update_interval: 1s
    filters:
      - delta: 0.01

  - platform: template
    name: "${name_voltage}"
    unit_of_measurement: "V"
    accuracy_decimals: 2
    lambda: "return id(voltage_v).state;"
    update_interval: 1s
    filters:
      - delta: 0.1

  - platform: template
    name: "${name_power}"
    unit_of_measurement: "W"
    accuracy_decimals: 2
    lambda: "return id(current_a).state * id(voltage_v).state;"
    update_interval: 1s
    filters:
      - delta: 0.1

  - platform: template
    name: "${name_position}"
    id: position_percent
    unit_of_measurement: "%"
    accuracy_decimals: 0
    lambda: "return id(g_position) * 100.0;"
    update_interval: 1s

  - platform: template
    name: "${name_extend_time}"
    unit_of_measurement: "ms"
    accuracy_decimals: 0
    lambda: "return id(g_extend_ms);"
    update_interval: 5s
    entity_category: diagnostic

  - platform: template
    name: "${name_retract_time}"
    unit_of_measurement: "ms"
    accuracy_decimals: 0
    lambda: "return id(g_retract_ms);"
    update_interval: 5s
    entity_category: diagnostic

  - platform: wifi_signal
    name: "${name_wifi_signal}"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "${name_uptime}"
    entity_category: diagnostic

# =============================================================================
#  Position state (0.0 = fully retracted, 1.0 = fully extended)
# =============================================================================
globals:
  - id: g_position
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_direction
    type: int
    restore_value: false
    initial_value: "0"        # -1 towards 0.0, 0 idle, +1 towards 1.0

  - id: g_move_start
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: g_planned_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # Measured full-travel times — overwritten by calibration, kept across reboots
  - id: g_extend_ms       # travel via sw_open (towards_zero:true) -> position 0.0
    type: uint32_t
    restore_value: true
    initial_value: "${extend_time_ms}"

  - id: g_retract_ms      # travel via sw_close (towards_zero:false) -> position 1.0
    type: uint32_t
    restore_value: true
    initial_value: "${retract_time_ms}"

  - id: g_below_thr_since
    type: uint32_t
    restore_value: false
    initial_value: "0"        # 0 = not currently below the endstop threshold

# =============================================================================
#  Tuning parameters — changeable from HA, no reflash needed
# =============================================================================
number:
  - platform: template
    name: "${name_endstop_thr}"
    id: endstop_threshold
    optimistic: true
    restore_value: true
    initial_value: 0.30
    min_value: 0.02
    max_value: 2.00
    step: 0.01
    unit_of_measurement: "A"
    entity_category: config
    mode: box

  - platform: template
    name: "${name_startup_grace}"
    id: startup_grace_ms
    optimistic: true
    restore_value: true
    initial_value: 800
    min_value: 200
    max_value: 3000
    step: 100
    unit_of_measurement: "ms"
    entity_category: config
    mode: box

  - platform: template
    name: "${name_max_runtime}"
    id: max_runtime_s
    optimistic: true
    restore_value: true
    initial_value: 15
    min_value: 5
    max_value: 60
    step: 1
    unit_of_measurement: "s"
    entity_category: config
    mode: box

  - platform: template
    name: "${name_endstop_debounce}"
    id: endstop_debounce_ms
    optimistic: true
    restore_value: true
    initial_value: 200
    min_value: 50
    max_value: 1000
    step: 50
    unit_of_measurement: "ms"
    entity_category: config
    mode: box

# =============================================================================
#  PhotoMOS outputs — software interlock, never both at once
# =============================================================================
switch:
  - platform: gpio
    id: sw_open
    pin: ${pin_out_open}
    restore_mode: ALWAYS_OFF
    internal: true
    interlock: &ilk [sw_open, sw_close]
    interlock_wait_time: 300ms

  - platform: gpio
    id: sw_close
    pin: ${pin_out_close}
    restore_mode: ALWAYS_OFF
    internal: true
    interlock: *ilk
    interlock_wait_time: 300ms

  # Physical button lock — when ON the hand controller does nothing.
  # HA control (cover, slider, calibration) keeps working.
  - platform: template
    name: "${name_button_lock}"
    id: button_lock
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: mdi:lock
    entity_category: config

# =============================================================================
#  Control scripts
# =============================================================================
script:
  # Emergency/manual stop. If something was running, it EXTRAPOLATES the
  # position from elapsed time and direction instead of leaving g_position
  # frozen — a frozen value would block movement back in HA.
  - id: stop_all
    mode: single
    then:
      - lambda: |-
          if (id(g_direction) != 0) {
            uint32_t elapsed = millis() - id(g_move_start);
            uint32_t full_ms = (id(g_direction) < 0) ? id(g_extend_ms) : id(g_retract_ms);
            if (full_ms > 0) {
              float delta = ((float) elapsed / (float) full_ms) * id(g_direction);
              id(g_position) += delta;
              if (id(g_position) < 0.0f) id(g_position) = 0.0f;
              if (id(g_position) > 1.0f) id(g_position) = 1.0f;
            }
          }
          id(g_direction) = 0;
      - switch.turn_off: sw_open
      - switch.turn_off: sw_close

  # Drive to the physical endstop.
  # g_direction convention: -1 = towards position 0.0 (via sw_open)
  #                         +1 = towards position 1.0 (via sw_close)
  # Must match move_to_position, otherwise the extrapolation on stop counts
  # backwards.
  # measure: true ONLY when the whole travel is guaranteed (calibration phases
  # that start from a known endstop). Regular open/close/button may start from
  # any mid position and must pass false, or a partial run would overwrite the
  # full-travel time.
  - id: drive_to_endstop
    mode: restart
    parameters:
      towards_zero: bool
      measure: bool
    then:
      - switch.turn_off: sw_open
      - switch.turn_off: sw_close
      - delay: 300ms
      - lambda: |-
          id(g_direction) = towards_zero ? -1 : 1;
          id(g_move_start) = millis();
          id(g_below_thr_since) = 0;
      - if:
          condition:
            lambda: "return towards_zero;"
          then:
            - switch.turn_on: sw_open
          else:
            - switch.turn_on: sw_close
      - lambda: "id(g_move_start) = millis();"
      - delay: !lambda "return (uint32_t) id(startup_grace_ms).state;"
      - wait_until:
          condition:
            lambda: |-
              if (id(current_a).state < id(endstop_threshold).state) {
                if (id(g_below_thr_since) == 0) id(g_below_thr_since) = millis();
                return (millis() - id(g_below_thr_since)) >= (uint32_t) id(endstop_debounce_ms).state;
              } else {
                id(g_below_thr_since) = 0;
                return false;
              }
          timeout: !lambda "return (uint32_t)(id(max_runtime_s).state * 1000);"
      - switch.turn_off: sw_open
      - switch.turn_off: sw_close
      - lambda: |-
          // Decide why we stopped from TIME, not from current — current drops
          // to zero the instant the outputs go off, so reading it here races.
          uint32_t elapsed = millis() - id(g_move_start);
          bool reached = elapsed < (uint32_t)(id(max_runtime_s).state * 1000);
          if (reached) {
            id(g_position) = towards_zero ? 0.0f : 1.0f;
            if (measure && elapsed > 1000 && elapsed < 30000) {
              if (towards_zero) { id(g_extend_ms) = elapsed; }
              else { id(g_retract_ms) = elapsed; }
            }
          } else {
            // Timeout — endstop not reached, estimate from time instead of
            // falsely pinning the position to 0/1.
            uint32_t full_ms = towards_zero ? id(g_extend_ms) : id(g_retract_ms);
            if (full_ms > 0) {
              float delta = ((float) elapsed / (float) full_ms) * id(g_direction);
              id(g_position) += delta;
              if (id(g_position) < 0.0f) id(g_position) = 0.0f;
              if (id(g_position) > 1.0f) id(g_position) = 1.0f;
            }
          }
          id(g_direction) = 0;
      - logger.log:
          format: "Endstop reached. extend=%u ms  retract=%u ms"
          args: ["id(g_extend_ms)", "id(g_retract_ms)"]

  # Calibration — hits both endstops, measures both times, ends at reference 0.0.
  # Phase 1 does NOT measure (unknown start); phases 2 and 3 do, because they
  # follow directly on a reached endstop and are guaranteed full travels.
  - id: calibrate
    mode: single
    then:
      - logger.log: "Calibration: phase 1/3 — to endstop via sw_open (position 0.0, not measuring)"
      - script.execute:
          id: drive_to_endstop
          towards_zero: true
          measure: false
      - wait_until:
          condition:
            lambda: "return !id(drive_to_endstop).is_running();"
          timeout: !lambda "return (uint32_t)(id(max_runtime_s).state * 1000) + 5000;"
      - delay: 500ms

      - logger.log: "Calibration: phase 2/3 — to endstop via sw_close (position 1.0, measuring)"
      - script.execute:
          id: drive_to_endstop
          towards_zero: false
          measure: true
      - wait_until:
          condition:
            lambda: "return !id(drive_to_endstop).is_running();"
          timeout: !lambda "return (uint32_t)(id(max_runtime_s).state * 1000) + 5000;"
      - delay: 500ms

      - logger.log: "Calibration: phase 3/3 — back to reference (position 0.0, measuring)"
      - script.execute:
          id: drive_to_endstop
          towards_zero: true
          measure: true
      - wait_until:
          condition:
            lambda: "return !id(drive_to_endstop).is_running();"
          timeout: !lambda "return (uint32_t)(id(max_runtime_s).state * 1000) + 5000;"

      - logger.log:
          format: "Calibration done. extend=%u ms  retract=%u ms"
          args: ["id(g_extend_ms)", "id(g_retract_ms)"]

  # Move to an exact position 0.0–1.0, timed from the measured travel times.
  # Same convention as drive_to_endstop: decreasing position (delta<0) = sw_open,
  # increasing position (delta>0) = sw_close.
  - id: move_to_position
    mode: restart
    parameters:
      target: float
    then:
      - lambda: |-
          float delta = target - id(g_position);
          if (fabs(delta) < 0.01f) {
            id(g_planned_ms) = 0;
            return;
          }
          bool towards_zero = (delta < 0);
          uint32_t full_ms = towards_zero ? id(g_extend_ms) : id(g_retract_ms);
          id(g_planned_ms) = (uint32_t)(fabs(delta) * full_ms);
          id(g_direction) = towards_zero ? -1 : 1;
          id(g_move_start) = millis();   // set now, so a stop during the 300 ms
                                         // pause below does not use a stale value
      - if:
          condition:
            lambda: "return id(g_planned_ms) > 0;"
          then:
            - switch.turn_off: sw_open
            - switch.turn_off: sw_close
            - delay: 300ms
            - if:
                condition:
                  lambda: "return id(g_direction) < 0;"
                then:
                  - switch.turn_on: sw_open
                else:
                  - switch.turn_on: sw_close
            - lambda: "id(g_move_start) = millis(); id(g_below_thr_since) = 0;"
            - wait_until:
                condition:
                  lambda: |-
                    uint32_t elapsed = millis() - id(g_move_start);
                    bool time_up = elapsed >= id(g_planned_ms);
                    bool past_grace = elapsed > (uint32_t) id(startup_grace_ms).state;
                    bool below_thr = id(current_a).state < id(endstop_threshold).state;
                    bool at_endstop = false;
                    if (past_grace && below_thr) {
                      if (id(g_below_thr_since) == 0) id(g_below_thr_since) = millis();
                      at_endstop = (millis() - id(g_below_thr_since)) >= (uint32_t) id(endstop_debounce_ms).state;
                    } else {
                      id(g_below_thr_since) = 0;
                    }
                    return time_up || at_endstop;
                timeout: !lambda "return id(g_planned_ms) + 3000;"
            - switch.turn_off: sw_open
            - switch.turn_off: sw_close
            - lambda: |-
                // Again decided from TIME: did we finish before the planned
                // duration? Then it was an endstop. Reading current here races.
                uint32_t elapsed = millis() - id(g_move_start);
                bool at_endstop = elapsed < id(g_planned_ms);
                if (at_endstop) {
                  id(g_position) = (id(g_direction) < 0) ? 0.0f : 1.0f;
                } else {
                  id(g_position) = target;
                }
                id(g_direction) = 0;
      - logger.log: "Move to position finished"

# =============================================================================
#  Original hand controller via PC817C — hold = drive to endstop, release = stop.
#  Releasing mid-travel runs stop_all, which extrapolates the position, so
#  physical operation is tracked too (with time-estimate accuracy).
# =============================================================================
binary_sensor:
  - platform: gpio
    id: btn_open
    name: "${name_btn_up}"
    pin:
      number: ${pin_btn_open}
      mode:
        input: true
      inverted: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 60ms
    on_press:
      - if:
          condition:
            switch.is_off: button_lock
          then:
            - script.execute:
                id: drive_to_endstop
                towards_zero: true
                measure: false
    on_release:
      - if:
          condition:
            switch.is_off: button_lock
          then:
            - script.stop: drive_to_endstop
            - script.stop: move_to_position
            - script.execute: stop_all

  - platform: gpio
    id: btn_close
    name: "${name_btn_down}"
    pin:
      number: ${pin_btn_close}
      mode:
        input: true
      inverted: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 60ms
    on_press:
      - if:
          condition:
            switch.is_off: button_lock
          then:
            - script.execute:
                id: drive_to_endstop
                towards_zero: false
                measure: false
    on_release:
      - if:
          condition:
            switch.is_off: button_lock
          then:
            - script.stop: drive_to_endstop
            - script.stop: move_to_position
            - script.execute: stop_all

  - platform: template
    name: "${name_moving}"
    id: is_moving
    lambda: "return id(g_direction) != 0;"
    device_class: moving

# =============================================================================
#  Home Assistant control — cover with a 0–100 % position slider
# =============================================================================
cover:
  - platform: template
    name: "${name_cover}"
    id: sofa
    device_class: awning
    lambda: "return id(g_position);"
    # HA expects 1.0 = open, 0.0 = closed. Calibration (towards_zero:true)
    # defines the reference as 0.0, so "open" in HA drives the other way.
    open_action:
      - script.execute:
          id: drive_to_endstop
          towards_zero: false
          measure: false
    close_action:
      - script.execute:
          id: drive_to_endstop
          towards_zero: true
          measure: false
    stop_action:
      - script.stop: drive_to_endstop
      - script.stop: move_to_position
      - script.execute: stop_all
    position_action:
      - script.execute:
          id: move_to_position
          target: !lambda "return pos;"

# =============================================================================
#  Manual calibration from HA — run once after install, then only when the
#  stored position may have drifted from reality.
# =============================================================================
button:
  - platform: template
    name: "${name_calibrate}"
    entity_category: config
    on_press:
      - script.execute: calibrate
